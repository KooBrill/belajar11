<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width initial-scale=1.0">
    <meta name="description" content="Ini tugas ke 3 ku sebelum aku mendapatkan tugas susah">
    <meta name="author" content="Muimsa">
    <title>tugas 3</title>
</head>

<body>
    <form action="/submit" method="post" id="form-pendaftaran Mahasiswa" style="margin-bottom: 50px;">
        <label for="nama">Nama Lengkap:</label>
        <input type="text" id="nama" name="nama" placeholder="Masukkan nama" required minlength="3" maxlength="50">

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="contoh@email.com" required>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" minlength="8" required>

        <label for="prodi">Program Studi:</label>
        <select id="prodi" name="prodi">
            <option value="" disabled selected>Pilih Program Studi</option>
            <option value="informatika">Informatika</option>
            <option value="sistem-informasi">Sistem Informasi</option>
            <option value="teknik-komputer">Teknik Komputer</option>
        </select>
    </form>

    <table border="1">
        <thead>
            <tr>
                <th>No</th>
                <th>Nama</th>
                <th>Email</th>
                <th>Program Studi</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>Muimsa</td>
                <td>[EMAIL_ADDRESS]</td>
                <td>Informatika</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="3">Total Mahasiswa</td>
                <td>1</td>
            </tr>
        </tfoot>
    </table>
</body>

</html>
